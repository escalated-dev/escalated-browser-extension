name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Tag matches the package and manifest versions
        run: |
          version="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          manifest=$(node -p "require('./public/manifest.json').version")
          if [ "$version" != "$pkg" ] || [ "$version" != "$manifest" ]; then
            echo "Tag $GITHUB_REF_NAME, package.json $pkg, manifest.json $manifest must all agree." >&2
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check:dist
      - run: npm run zip
      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          gh release upload "$TAG" escalated-browser-extension-*.zip --clobber
